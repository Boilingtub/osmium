[package]
name = "osmium"
version = "0.1.0"
authors = ["Jan-hendrik Brink <https://github.com/Boilingtub>"]
edition = "2021"

[dependencies]
cfg-if = "1"
anyhow = "1.0"
winit = { version = "0.29", features = ["rwh_05"] }
env_logger = "0.11.6"
log = "0.4"
wgpu = "23.0.1"
pollster = "0.4"
bytemuck = {version = "1.21", features = ["derive"] }
image = { version = "0.25", features = ["png","jpeg","webp"]}
cgmath = "0.18"
tobj = { version = "4.0.2", default-features = false, features = ["async"]}

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.3"
glob = "0.3.1"

[lib]
crate-type = ["rlib"]

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'  # Platform-specific.
strip = "debuginfo"
debug-assertions = false
overflow-checks = false
lto = true
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
